# git-cliff configuration — generates CHANGELOG.md from Conventional Commits.
# Regenerate with `just changelog`. Docs: https://git-cliff.org/docs/configuration
[changelog]
header = """
# Changelog

All notable changes to Zamo are recorded here. Entries are generated from
[Conventional Commits](https://www.conventionalcommits.org) by
[git-cliff](https://git-cliff.org); the layout follows
[Keep a Changelog](https://keepachangelog.com).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %}
  - **BREAKING:** {{ commit.breaking_description | trim | replace(from="\n", to=" ") | upper_first }}\
{% endif %}\
{% endfor %}
{% endfor %}

"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Grouped in the order listed; a commit takes the first parser it matches.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = "^ci", group = "<!-- 6 -->CI & Build" },
    { message = "^build", group = "<!-- 6 -->CI & Build" },
    { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
    { message = ".*", group = "<!-- 7 -->Miscellaneous" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
