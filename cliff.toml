# git-cliff configuration — generates CHANGELOG.md from Conventional Commits.
# Regenerate with `just changelog`. Docs: https://git-cliff.org/docs/configuration
[changelog]
header = """
# Changelog

All notable changes to Zamo are recorded here. Entries are generated from
[Conventional Commits](https://www.conventionalcommits.org) by
[git-cliff](https://git-cliff.org); the layout follows
[Keep a Changelog](https://keepachangelog.com).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking and commit.breaking_description != commit.message %}
  - {{ commit.breaking_description | trim | replace(from="\n", to=" ") | upper_first }}\
{% endif %}\
{% endfor %}
{% endfor %}

"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/zamomd/zamo/pull/${1}))" },
]
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^[a-z]+\\(deps\\)", skip = true },
    { field = "author.name", pattern = "^dependabot", skip = true },
    { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking Changes" },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = ".*", group = "<!-- 4 -->Internal" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
