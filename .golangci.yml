version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - revive
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - depguard
    - lll
  settings:
    lll:
      line-length: 120
    depguard:
      rules:
        domain-stdlib-only:
          files:
            - "**/internal/knowledge/**"
            - "!$test"
          allow:
            - $gostd
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - linters: [revive]
        text: "unused-parameter"

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/cominddev/comind
