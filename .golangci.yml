version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - revive
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - depguard
    - lll
    - testifylint
  settings:
    lll:
      line-length: 120
    testifylint:
      enable-all: true
    depguard:
      rules:
        domain-stdlib-only:
          files:
            - "**/internal/knowledge/**"
            - "!$test"
          allow:
            - $gostd
        # Entry points talk to the domain, never to storage.
        entrypoints-no-storage:
          files:
            - "**/internal/mcp/**"
            - "**/internal/wailsbind/**"
            - "!$test"
          deny:
            - pkg: github.com/zamomd/zamo/internal/sqlite
              desc: entry points must not depend on the storage adapter
            - pkg: github.com/zamomd/zamo/internal/modules
              desc: modules reach entry points through registration in app
        # A feature module sees the host capability layer, domain types and
        # its own subpackages only.
        modules-host-only:
          files:
            - "**/internal/modules/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/zamomd/zamo/internal/host
            - github.com/zamomd/zamo/internal/knowledge
            - github.com/zamomd/zamo/internal/modules
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - linters: [revive]
        text: "unused-parameter"

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/zamomd/zamo
