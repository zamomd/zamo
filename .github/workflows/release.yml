name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the dry-run bundle
        default: "0.0.0"

permissions:
  contents: write # create the Release and upload the bundle

jobs:
  release:
    name: macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags, so git-cliff can diff against the previous tag

      - uses: ./.github/actions/setup-go-env
        with:
          cache-name: release

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - uses: ./.github/actions/setup-wails3

      - name: Derive the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the bundle version into build/config.yml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i.bak -E 's|^  version: "[^"]*" # The application version|  version: "'"$VERSION"'" # The application version|' build/config.yml
          rm build/config.yml.bak
          grep -F "version: \"$VERSION\" # The application version" build/config.yml

      - name: Package the .app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: wails3 task package VERSION="$VERSION"

      - name: Zip the bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # ditto preserves the bundle's symlinks and metadata; a plain zip does not.
        run: |
          zip="comind-${VERSION}-darwin-arm64.zip"
          ditto -c -k --keepParent bin/comind.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"

      - name: Generate release notes with git-cliff
        env:
          # Pinned by version + sha256 (no floating tags), matching the gitleaks job.
          GIT_CLIFF_VERSION: "2.13.1"
          GIT_CLIFF_SHA256: "21547ae4a0421164070ab75c2522864ea5565858a011fabc5f583061b20f1226"
        run: |
          set -euo pipefail
          asset="git-cliff-${GIT_CLIFF_VERSION}-aarch64-apple-darwin.tar.gz"
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${asset}"
          curl -sSfL "$url" -o git-cliff.tar.gz
          echo "${GIT_CLIFF_SHA256}  git-cliff.tar.gz" | shasum -a 256 -c -
          tar -xzf git-cliff.tar.gz "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          "./git-cliff-${GIT_CLIFF_VERSION}/git-cliff" --config cliff.toml --latest --strip all \
            -o RELEASE_NOTES.md
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md ./comind-*.zip ./comind-*.zip.sha256

      - name: Upload the dry-run bundle
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comind-dry-run
          path: |
            comind-*.zip
            comind-*.zip.sha256
          retention-days: 3
