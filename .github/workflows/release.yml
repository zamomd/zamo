name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the dry-run bundle
        default: "0.0.0"

permissions:
  contents: write # create the Release and upload the bundle

jobs:
  release:
    name: macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      NOTARY_PROFILE: comind-notary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags, so git-cliff can diff against the previous tag

      - uses: ./.github/actions/setup-go-env
        with:
          cache-name: release

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - uses: ./.github/actions/setup-wails3

      - name: Derive the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse an unsigned official release
        if: env.SIGNING != 'true' && vars.REQUIRE_SIGNING == 'true' && github.ref_type == 'tag'
        run: |
          echo "::error::REQUIRE_SIGNING is set but the signing secrets are missing"
          exit 1

      # The keychain is the runner's default for the rest of the job, so codesign
      # finds the identity and notarytool finds the stored profile without flags.
      - name: Import the Developer ID certificate and notary credentials
        id: cert
        if: env.SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$keychain" \
            --key "$RUNNER_TEMP/api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
          rm "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/api-key.p8"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ {print $2; exit}')
          test -n "$identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the build assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: build
        run: |
          wails3 update build-assets -name comind -binaryname comind -config config.yml \
            -productversion "$VERSION" -dir .
          grep -A1 CFBundleShortVersionString darwin/Info.plist | grep -F ">$VERSION<"

      - name: Package the .app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: wails3 task package VERSION="$VERSION"

      - name: Sign with the hardened runtime
        env:
          IDENTITY: ${{ steps.cert.outputs.identity || '-' }}
        run: |
          set -euo pipefail
          if [ "$SIGNING" = true ]; then
            wails3 tool sign --input bin/comind.app --identity "$IDENTITY" \
              --notarize --keychain-profile "$NOTARY_PROFILE"
          else
            wails3 tool sign --input bin/comind.app --identity - --hardened-runtime
          fi
          codesign --verify --deep --strict bin/comind.app
          # The hardened runtime refuses a non-system dylib; a bundle that cannot
          # start must not ship.
          bin/comind.app/Contents/MacOS/comind --version

      - name: Zip the bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # ditto preserves the bundle's symlinks and metadata; a plain zip does not.
        run: ditto -c -k --keepParent bin/comind.app "comind-${VERSION}-darwin-arm64.zip"

      - name: Build the disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wails3 task darwin:create:dmg
          mv bin/comind.dmg "comind-${VERSION}-darwin-arm64.dmg"

      - name: Sign, notarize and staple the disk image
        if: env.SIGNING == 'true'
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$IDENTITY" comind-*.dmg
          xcrun notarytool submit comind-*.dmg --keychain-profile "$NOTARY_PROFILE" --wait
          # stapler finds no ticket unless the submission was accepted.
          xcrun stapler staple comind-*.dmg

      - name: Verify Gatekeeper acceptance
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          spctl --assess --type execute -vv bin/comind.app
          spctl --assess --type open --context context:primary-signature -vv comind-*.dmg
          xcrun stapler validate bin/comind.app
          xcrun stapler validate comind-*.dmg

      - name: Write checksums
        run: |
          for f in comind-*.zip comind-*.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Generate release notes with git-cliff
        env:
          # Pinned by version + sha256 (no floating tags), matching the gitleaks job.
          GIT_CLIFF_VERSION: "2.13.1"
          GIT_CLIFF_SHA256: "21547ae4a0421164070ab75c2522864ea5565858a011fabc5f583061b20f1226"
        run: |
          set -euo pipefail
          asset="git-cliff-${GIT_CLIFF_VERSION}-aarch64-apple-darwin.tar.gz"
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${asset}"
          curl -sSfL "$url" -o git-cliff.tar.gz
          echo "${GIT_CLIFF_SHA256}  git-cliff.tar.gz" | shasum -a 256 -c -
          tar -xzf git-cliff.tar.gz "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          "./git-cliff-${GIT_CLIFF_VERSION}/git-cliff" --config cliff.toml --latest --strip all \
            -o RELEASE_NOTES.md
          if [ "$SIGNING" != true ]; then
            printf '\n> This build is ad-hoc signed and not notarized, so macOS blocks its first launch. Allow it under System Settings → Privacy & Security → Open Anyway.\n' >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md ./comind-*.zip ./comind-*.dmg ./comind-*.sha256

      - name: Upload the dry-run bundle
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comind-dry-run
          path: |
            comind-*.zip
            comind-*.dmg
            comind-*.sha256
          retention-days: 3

      - name: Remove the signing keychain
        if: always() && env.SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
