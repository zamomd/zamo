name: security

on:
  push:
    branches: [main]
  pull_request:

# Gitleaks scans history, so stacked pushes on a PR would pile up; cancel superseded
# runs like ci.yml does.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      # This repo is private and GitHub Advanced Security is not on the plan, so the
      # official gitleaks-action would need a paid licence. Run the CLI instead, pinned
      # by version + sha256 (no floating tags).
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # fetch-depth: 0 → full history, so origin/<base> exists for the PR range scan.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: |
          set -euo pipefail
          # On a PR, scan only the commits it adds (origin/<base>..HEAD); on a push to
          # main there is no base ref, so scan the full history. A secret added then
          # removed inside the PR still trips this — the fix is key rotation plus a
          # squash/rebase merge, not a follow-up commit.
          if [ -n "${{ github.base_ref }}" ]; then
            gitleaks git . --no-banner --redact --verbose \
              --log-opts="origin/${{ github.base_ref }}..HEAD"
          else
            gitleaks git . --no-banner --redact --verbose
          fi
